<div class="consulta-tabela">
  <button matButton="filled" (click)="agendar()">Agendar consulta</button>

  @if (erro()) {
    <p class="mensagem-erro">{{ erro() }}</p>
  } @else if (consultas().length === 0) {
    <p>Nenhuma consulta encontrada.</p>
  } @else {
    <!-- DadosDetalhamentoConsulta não traz o motivo de cancelamento, então esta
         tabela não tem como diferenciar visualmente uma consulta já cancelada
         de uma ativa — é uma limitação do DTO devolvido pela API. -->
    <table mat-table [dataSource]="consultas()" class="mat-elevation-z1">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>Nº</th>
        <td mat-cell *matCellDef="let consulta">{{ consulta.id }}</td>
      </ng-container>

      <ng-container matColumnDef="Paciente">
        <th mat-header-cell *matHeaderCellDef>Paciente</th>
        <td mat-cell *matCellDef="let consulta">{{ consulta.nomePaciente}}</td>
      </ng-container>

      <ng-container matColumnDef="Medico">
        <th mat-header-cell *matHeaderCellDef>Médico</th>
        <td mat-cell *matCellDef="let consulta">{{ consulta.nomeMedico }}</td>
      </ng-container>

      <ng-container matColumnDef="data">
        <th mat-header-cell *matHeaderCellDef>Data</th>
        <td mat-cell *matCellDef="let consulta">{{ consulta.data }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let consulta">
          <button matIconButton (click)="cancelar(consulta.id)" aria-label="Cancelar">
            <mat-icon>event_busy</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
    </table>
  }

  <mat-paginator
    [length]="totalElementos()"
    [pageIndex]="pagina()"
    [pageSize]="tamanhoPagina()"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="paginar($event)"
  ></mat-paginator>
</div>
