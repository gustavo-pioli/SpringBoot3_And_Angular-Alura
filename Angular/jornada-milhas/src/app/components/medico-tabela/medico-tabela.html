<div class="medico-tabela">
  <button matButton="filled" (click)="cadastrar()">Novo médico</button>

  <table mat-table [dataSource]="medicos()" class="mat-elevation-z1">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let medico">{{ medico.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let medico">{{ medico.email }}</td>
    </ng-container>

    <ng-container matColumnDef="crm">
      <th mat-header-cell *matHeaderCellDef>CRM</th>
      <td mat-cell *matCellDef="let medico">{{ medico.crm }}</td>
    </ng-container>

    <ng-container matColumnDef="especialidade">
      <th mat-header-cell *matHeaderCellDef>Especialidade</th>
      <td mat-cell *matCellDef="let medico">{{ medico.especialidade }}</td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef>Ações</th>
      <td mat-cell *matCellDef="let medico">
        <button matIconButton (click)="editar(medico.id)" aria-label="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button matIconButton (click)="excluir(medico.id)" aria-label="Excluir">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas"></tr>
  </table>

  <!-- length/pageIndex/pageSize controlam a UI; (page) devolve o que o usuário
       escolheu para buscarmos a página certa na API. -->
  <mat-paginator
    [length]="totalElementos()"
    [pageIndex]="pagina()"
    [pageSize]="tamanhoPagina()"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="paginar($event)"
  ></mat-paginator>
</div>
